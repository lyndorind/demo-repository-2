[project]
name = "demo-repository-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]==0.141.1",
    "sqlalchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
demo-repository-2 = "demo_repository_2:main"

[tool.fastapi]
entrypoint = "demo_repository_2.main:app"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
