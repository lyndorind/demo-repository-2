services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: task_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qwerty12}
      POSTGRES_DB: tasks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_manager -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://task_manager:${POSTGRES_PASSWORD:-qwerty12}@postgres:5432/tasks
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
